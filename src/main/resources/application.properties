# =========================================
# DATASOURCE - SUPABASE (CORREGIDO)
# =========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.opcqwnlroimpacxgwlbi.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# SERVER PORT (OBLIGATORIO EN RAILWAY)
# =========================================
server.port=${PORT:8080}

# =========================================
# ACTUATOR (para que Railway vea que está vivo)
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always