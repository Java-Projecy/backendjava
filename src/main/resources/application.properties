# =========================================
# DATASOURCE - SUPABASE TRANSACTION POOLER (CONFIGURACIÓN FINAL)
# =========================================
spring.datasource.url=jdbc:postgresql://aws-1-ca-central-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.opcqwnlroimpacxgwlbi
spring.datasource.password=123456789

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# =========================================
# JPA / HIBERNATE - CONFIGURACIÓN PARA TRANSACTION POOLER
# =========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# IMPORTANTE: Deshabilitar prepared statements para transaction pooler
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.order_updates=false
spring.jpa.properties.hibernate.order_inserts=false

# =========================================
# SERVER
# =========================================
server.port=${PORT:8080}

# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always