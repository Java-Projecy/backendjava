# =========================================
# DATASOURCE - SUPABASE PostgreSQL
# =========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.opcqwnlroimpacxgwlbi.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# HIKARI CONNECTION POOL
# =========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# =========================================
# JPA / HIBERNATE
# =========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# =========================================
# LOGGING
# =========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# =========================================
# SERVER
# =========================================
server.port=${PORT:8080}

# ← ESTO ES LO QUE FALTABA PARA QUE RAILWAY VEA EL HEALTHCHECK
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always